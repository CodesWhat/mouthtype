# Virtual microphone. Audio played into the "mouthtype_mic_input" sink comes out of the
# "mouthtype_virtual_mic" source, which is the only source in the container and so the default.
# Feed it with: pw-play --target mouthtype_mic_input file.wav
context.modules = [
    { name = libpipewire-module-loopback
      args = {
          node.description = "Mouthtype Virtual Microphone"
          capture.props = {
              node.name = "mouthtype_mic_input"
              media.class = "Audio/Sink"
              audio.position = [ MONO ]
          }
          playback.props = {
              node.name = "mouthtype_virtual_mic"
              media.class = "Audio/Source"
              audio.position = [ MONO ]
          }
      }
    }
]
