# Hyprland <= 0.54 only. Newer configurations use hyprland.lua.
# Choose unused keys; do not keep another dictation app on these bindings.
bind = , F10, exec, mouthtype-linux toggle
bind = , F11, exec, mouthtype-linux cancel

# Hold-to-talk is not offered as a bare start/stop pair. Press and release launch two independent
# processes with no ordering between them, so a quick tap or a rapid repeat can leave a recording running.
# With the Omarchy plugin installed, bind its ordered wrapper instead:
# bind = , F9, exec, ~/.config/omarchy/plugins/dstahl.mouthtype/control.py start
# bindr = , F9, exec, ~/.config/omarchy/plugins/dstahl.mouthtype/control.py stop
