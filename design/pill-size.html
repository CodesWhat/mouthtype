<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Mouthtype Hi-Fi pill size</title>
<style>
body{font:15px system-ui;background:#e9e7e1;color:#242424;margin:50px auto;max-width:650px}h1{font-size:22px}fieldset{border:1px solid #c5c2b9;border-radius:12px;padding:18px}label{display:inline-flex;gap:8px;align-items:center;margin-right:22px}.preview{height:200px;margin-top:26px;border:1px solid #cdc9be;border-radius:16px;background:#f9f8f4;display:flex;align-items:flex-end;justify-content:center;padding-bottom:32px;box-sizing:border-box}img{image-rendering:pixelated;width:146px;height:32px}p{color:#605e57;line-height:1.5}small{display:block;margin-top:16px}
</style>
<h1>Hi-Fi pill size</h1><p>In Mouthtype’s Pill Style menu, choose Hi-Fi Size. Your choice is remembered.</p>
<fieldset><legend>Hi-Fi Size</legend><label><input type="radio" name="size" value="1" checked>Standard</label><label><input type="radio" name="size" value="2">Large (2×)</label></fieldset>
<div class="preview"><img id="pill" alt="Hi-Fi recording pill" src="../Sources/MouthtypeMac/Resources/Pill/hifi/chassis.png"></div>
<small>Selects the Hi-Fi pill. A size change during recording takes effect the next time the pill appears.</small>
<script>for(const option of document.querySelectorAll('input'))option.addEventListener('change',()=>{const scale=Number(option.value);const pill=document.querySelector('#pill');pill.style.width=`${146*scale}px`;pill.style.height=`${32*scale}px`;});</script>
</html>
