<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouthtype · Dictation shortcut</title>
<style>
body{margin:0;background:#e9e7e1;color:#25241f;font:15px system-ui;display:grid;place-items:center;min-height:100vh}main{background:#faf9f5;border:1px solid #cfcdc4;border-radius:15px;box-shadow:0 18px 65px #0002;width:460px;padding:30px}h1{font:30px Georgia;margin:0 0 12px}p{color:#66655e;line-height:1.5}button{font:inherit;border:1px solid #c7c5bb;border-radius:7px;padding:8px 14px;background:#fff;cursor:pointer}#record{display:block;width:100%;padding:22px;margin:22px 0 12px;font-size:23px;background:#f0eee6}#record.listening{outline:3px solid #4f735b}footer{display:flex;gap:9px;align-items:center;margin-top:26px}#save{background:#375f44;color:white;border-color:#375f44}#save:disabled{opacity:.4;cursor:default}.spacer{flex:1}small{color:#77766d}#hint{min-height:45px}
</style>
<main><h1>Dictation shortcut</h1><p>Choose a key or a key combination.<br>Hold it to talk. Release it to insert your words.</p>
<button id="record">Fn / Globe</button><p id="hint">Click the shortcut to record a new one.</p><small>Double-tap for hands-free. Your shortcut is reserved for Mouthtype while it runs.</small>
<footer><button id="reset">Use Fn / Globe</button><span class="spacer"></span><button id="cancel">Cancel</button><button id="save" disabled>Save</button></footer></main>
<script>
let listening=false,saved='Fn / Globe',draft=saved;
const record=document.querySelector('#record'),hint=document.querySelector('#hint'),save=document.querySelector('#save');
record.onclick=()=>{listening=true;record.classList.add('listening');record.textContent='Press a key or combination…';hint.textContent='Release all keys when you’re done. Use Cancel to leave without saving.';save.disabled=true};
document.onkeydown=e=>{if(!listening)return;e.preventDefault();if(e.repeat)return;const mods=[e.ctrlKey?'⌃':'',e.altKey?'⌥':'',e.shiftKey?'⇧':'',e.metaKey?'⌘':''].join('');draft=mods+(['Control','Alt','Shift','Meta'].includes(e.key)?'':e.key===' '?'Space':e.key);record.textContent=draft;};
document.onkeyup=e=>{if(!listening)return;e.preventDefault();if(e.ctrlKey||e.altKey||e.shiftKey||e.metaKey)return;listening=false;record.classList.remove('listening');save.disabled=false;hint.textContent='Ready to save. This key or combination will start dictation instead of its usual action.'};
document.querySelector('#reset').onclick=()=>{draft='Fn / Globe';record.textContent=draft;listening=false;record.classList.remove('listening');save.disabled=false;hint.textContent='Use the default Fn / Globe shortcut.'};
document.querySelector('#cancel').onclick=()=>{listening=false;draft=saved;record.textContent=saved;record.classList.remove('listening');save.disabled=true;hint.textContent='No changes saved.'};
save.onclick=()=>{saved=draft;save.disabled=true;hint.textContent='Shortcut saved. Changes apply immediately.'};
</script></html>
