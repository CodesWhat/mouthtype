<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouthtype · Focused setup</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f2;color:#17202b;font:15px system-ui;display:grid;min-height:100vh;place-items:center}.window{width:min(650px,100%);min-height:590px;background:white;border:1px solid #d1d4d8;border-radius:14px;box-shadow:0 15px 50px #18202a16;display:flex;flex-direction:column;padding:32px}header{display:flex;justify-content:space-between;gap:20px}small{font:11px monospace;letter-spacing:1.2px;color:#626b76}.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 0}.symbol{width:66px;height:66px;display:grid;place-items:center;background:#eff3f2;border-radius:18px;color:#315c56;font-size:29px}h1{font:42px Georgia;margin:24px 0 14px}p{max-width:440px;color:#626b76;line-height:1.55;margin:0 0 22px;white-space:pre-line}button{font:inherit;padding:11px 17px;border:1px solid #cbd1d6;background:#f8f9fa;border-radius:7px;color:inherit;cursor:pointer}.primary{background:#315c56;color:white;border-color:#315c56}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e3e5e8;padding-top:22px}.hint{font-size:12px;margin:16px 0 0}.preview{position:fixed;bottom:10px;color:#626b76;font:11px monospace}@media(max-width:550px){.window{padding:24px}h1{font-size:36px}}
</style>
<main class="window"><header><small>MOUTHTYPE / GET STARTED</small><small id="progress"></small></header><section class="card" aria-live="polite"><span class="symbol" id="symbol" aria-hidden="true"></span><h1 id="title"></h1><p id="detail"></p><button class="primary" id="action"></button></section><footer><button id="refresh">Refresh status</button><button id="later">Set up later</button></footer><p class="hint">Reopen setup from Settings → General.</p></main><span class="preview">Layout prototype. Buttons simulate successful setup, without requesting access.</span>
<script>
const cards=[['♩','Let’s hear you.','Allow microphone access so Mouthtype can hear you while you dictate.','Allow microphone…'],['⌘','Put your words to work.','Accessibility lets your shortcut work and puts text into your chosen app.
Enable Mouthtype in System Settings, then return here.','Open System Settings…'],['⌁','Keep recognition on your Mac.','Your speech model downloads once. Setup continues when it is loaded and ready.','Preview model ready'],['⌨','Your shortcut, ready.','Hold Fn to speak, then release to paste. Change the key or recording behavior in Input settings.','Input settings…'],['✓','You’re ready to talk.','Click a text field in another app, hold Fn and speak, then release to paste.','Done']];
let step=0;const byId=id=>document.getElementById(id);function render(){const c=cards[step];byId('progress').textContent=step<4?`STEP ${step+1} OF 4`:'READY';['symbol','title','detail','action'].forEach((id,i)=>byId(id).textContent=c[i]);byId('later').textContent=step===4?'Done':'Set up later';byId('action').hidden=step===4;}byId('action').onclick=()=>{step=Math.min(step+1,4);render()};byId('refresh').onclick=render;byId('later').onclick=()=>{step=0;render()};render();
</script></html>
