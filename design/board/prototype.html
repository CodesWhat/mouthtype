body{margin:0;font:13px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#222;background:#fafafa;display:flex;min-height:100vh}
#side{width:272px;flex:none;padding:16px 14px;border-right:1px solid #e3e3e6;background:#fff;position:sticky;top:0;height:100vh;overflow:auto}
#side h1{font-size:14px;margin:0 0 2px}

.grp{margin:0 0 12px}.grp>label,.grp>.lbl{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#888;margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:4px}
button,select,input[type=text]{font:inherit;font-size:12px;padding:4px 9px;border:1px solid #d5d5d9;border-radius:6px;background:#fff;color:#222}
button{cursor:pointer}button:hover{background:#f1f1f3}button.on{background:#222;color:#fff;border-color:#222}
input[type=text]{width:100%;margin-top:4px}input[type=range]{width:100%}
#main{flex:1;min-width:0;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
#stage{border-radius:10px;padding:14px;border:1px solid rgba(128,128,128,.25);background-size:cover;background-position:center}
#stage.light{background-color:#f5f5f7;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(120,120,130,.14) 13px 16px),repeating-linear-gradient(90deg,transparent 0 90px,rgba(120,120,130,.07) 90px 92px)}
#stage.dark{background-color:#1c1c1f;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(200,200,210,.11) 13px 16px),repeating-linear-gradient(90deg,transparent 0 90px,rgba(255,255,255,.04) 90px 92px)}
#gal{display:grid;gap:12px}
.card{position:relative;border-radius:8px;padding:6px 8px 4px}
.card .nm{font-size:11px;font-weight:600;cursor:pointer;display:inline-block;padding:1px 6px;border-radius:5px}
.card .bl{font-size:10px;opacity:.75;margin-left:4px}
.card.sel .nm{outline:1.5px solid currentColor}
.light .card,.photo .card{color:#222}.dark .card{color:#ddd}
.photo .card .nm,.photo .card .bl{background:rgba(255,255,255,.78);color:#111;opacity:1}
.hosts{display:flex;flex-wrap:wrap;gap:0 6px}
.pillwrap{position:relative;flex:none}
.pillwrap .glassbk{position:absolute;display:none;pointer-events:none}
.pillwrap canvas{position:absolute;left:0;top:0;image-rendering:auto}
#dockwrap{border-radius:10px;overflow:hidden;position:relative;height:calc(var(--z)*150px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:1px solid rgba(128,128,128,.25);background-size:cover}
#dockpill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--z)*54px)}
#dock{margin-bottom:calc(var(--z)*8px);display:flex;gap:calc(var(--z)*8px);padding:calc(var(--z)*7px);border-radius:calc(var(--z)*20px);background:rgba(255,255,255,.28);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.35)}
#dock i{display:block;width:calc(var(--z)*40px);height:calc(var(--z)*40px);border-radius:calc(var(--z)*9px)}
#panel{background:#fff;border:1px solid #e3e3e6;border-radius:10px;padding:12px 14px;font-size:12px}
#panel h3{margin:0 0 6px;font-size:12px}#panel table{border-collapse:collapse;width:100%}
#panel td{padding:2px 8px 2px 0;vertical-align:top;border-bottom:1px solid #f0f0f2}#panel td:first-child{color:#888;white-space:nowrap;width:120px}
#panel .note{color:#777;margin-top:8px;font-size:11px}
#cardstage{border-radius:10px;padding:12px 14px;border:1px solid rgba(128,128,128,.25);background-size:cover;background-position:center}
#cardstage.light{background-color:#f5f5f7;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(120,120,130,.14) 13px 16px)}
#cardstage.dark{background-color:#1c1c1f;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(200,200,210,.11) 13px 16px)}
#cardstage h2{font-size:12px;margin:0 0 6px;font-weight:600}.light #cardstage h2,#cardstage.light h2{color:#222}#cardstage.dark h2{color:#ddd}#cardstage.photo h2,#cardstage.photo .ctitle{background:rgba(255,255,255,.8);color:#111;display:inline-block;padding:1px 6px;border-radius:5px}
#cardrow{display:grid;gap:10px;align-items:end}
.cframe{display:flex;flex-direction:column;align-items:center}.ctitle{font-size:10px;opacity:.7;margin-bottom:2px;align-self:flex-start}
#cardstage.light .ctitle{color:#333}#cardstage.dark .ctitle{color:#ccc}
.cwrap{position:relative;flex:none}.dcard{position:absolute;left:0;top:0;transform-origin:top left;padding:16px;opacity:0;transition:opacity .18s ease-out,transform .2s cubic-bezier(.2,.9,.3,1.15);}
.dcard{transform-origin:top left}
.dcard:not(.in){opacity:0;translate:0 10px}.dcard.in{opacity:1;translate:0 0}
.dcard .gbk{position:absolute;pointer-events:none}.dcard canvas.chrome{position:absolute;left:0;top:0;pointer-events:none}
.dcard .face{position:relative;width:224px;padding:11px 12px 12px;color:var(--ink);font:13px/18px -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.dcard .hdr{display:flex;align-items:center;gap:7px;min-height:20px}
.dcard .rdot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 6px var(--warn)}
.dcard .rsn{flex:1;font-size:12px;font-weight:600;opacity:.85}
.dcard .rsn.rounded{font-family:"SF Pro Rounded",ui-rounded,-apple-system,sans-serif}.dcard.led .rsn.sans,.dcard.led .rsn.rounded{color:#f1f0e6;opacity:.92}.dcard.th-light.led .rsn.sans,.dcard.th-light.led .rsn.rounded{color:#1d1d1f}
.dcard .chip{display:inline-block;background:#0c0b09;border-radius:var(--trad);padding:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.08);line-height:0}
.dcard .sub{font-size:11.5px;line-height:15px;opacity:.62;margin:6px 0 0 0;display:none}.dcard.th-dark .sub{color:#e8e6d8}.dcard.th-light .sub{color:#1d1d1f}
.dcard .x{width:20px;height:20px;border:0;border-radius:var(--xrad);background:rgba(128,128,128,.16);position:relative;padding:0;flex:none}
.dcard .x:hover{background:rgba(128,128,128,.3)}.dcard .x:active{background:rgba(128,128,128,.42)}
.dcard .x:before,.dcard .x:after{content:"";position:absolute;left:5.5px;top:9.2px;width:9px;height:1.6px;border-radius:1px;background:currentColor;transform:rotate(45deg);color:inherit}
.dcard .x:after{transform:rotate(-45deg)}
.dcard.th-dark .x{color:rgba(255,255,255,.85)}.dcard.th-light .x{color:rgba(0,0,0,.65)}
.dcard .tr{margin:8px 0 11px;max-height:90px;overflow-y:auto;color:inherit;overflow-wrap:anywhere;scrollbar-width:thin}
.dcard.th-dark .tr,.dcard.th-dark.led .tr{color:#f1f0e6}.dcard.th-light .tr{color:#1d1d1f}
.dcard.led .tr{background:rgba(0,0,0,.5);border-radius:var(--trad);padding:7px 10px;color:#f1f0e6;box-shadow:inset 0 1px 3px rgba(0,0,0,.7),0 0 0 .5px rgba(255,255,255,.07)}
.dcard.led.th-light .tr{background:#101012;color:#f1f0e6}
.dcard .btns{display:flex;gap:6px;justify-content:flex-end}
.dcard .cb{height:26px;min-width:64px;border:0;padding:0 14px;border-radius:var(--brad);font:600 12px/26px -apple-system,"SF Pro Text",Arial,sans-serif;cursor:pointer;transition:background .12s,transform .08s;color:inherit}
.dcard .cb.sec{background:rgba(128,128,128,.18);color:var(--ink)}.dcard .cb.sec:hover{background:rgba(128,128,128,.3)}.dcard .cb.sec:active{background:rgba(128,128,128,.42);transform:scale(.97)}
.dcard .cb.pri{background:var(--ink);color:var(--on-ink)}.dcard .cb.pri:hover{filter:brightness(1.12)}.dcard .cb.pri:active{filter:brightness(.82);transform:scale(.97)}
.dcard .cb.done{pointer-events:none}
.dcard .bar{height:2px;margin:10px -2px 0;border-radius:1px;background:rgba(128,128,128,.2);overflow:hidden}.dcard .bar i{display:block;height:100%;width:100%;background:var(--ink);opacity:.8}
.phost{position:relative;width:100%;pointer-events:none;overflow:visible;display:flex;justify-content:center;margin-top:0}
.phost .pillwrap{margin-top:calc(var(--pm,0px))}
.sheet{font:13px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#222;padding:18px 20px;background:#fff}
.sheet h1{font-size:18px;margin:0 0 4px}.sheet h2{font-size:14px;margin:18px 0 6px}.sheet .sub{color:#666;margin-bottom:12px;font-size:12px}
.drow{display:flex;gap:6px;margin-bottom:6px}.dlab{width:200px;flex:none;font-size:12px;padding-top:8px}.dlab b{font-size:13px}
.cell{border-radius:8px;flex:none;overflow:hidden}
.bgL{background-color:#f5f5f7;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(120,120,130,.14) 13px 16px)}
.bgD{background-color:#1c1c1f;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(200,200,210,.11) 13px 16px)}
.bgP{background-size:cover;background-position:center}
.scell{display:flex;flex-direction:column;align-items:center}.slab{font-size:10px;opacity:.7;margin-top:2px}
.bgD .slab{color:#ccc}.bgL .slab{color:#444}

.dcard.led.btn-calm .cb.pri{background:#f1f0e6;color:#1d1d1f}.dcard.led.btn-calm.th-light .cb.pri{background:#1d1d1f;color:#fff}
.dcard.led.btn-calm .cb.sec{color:inherit}.dcard.led.th-dark .cb.sec{color:#f1f0e6}.dcard.led.th-light .cb.sec{color:#1d1d1f}
.dcard.led .rdot{box-shadow:0 0 6px var(--warn)}

.dcard .face{font-family:var(--tf);font-size:calc(13px + var(--ts,0px));line-height:1.38}
.dcard .tr{max-height:calc(5 * 1.38em);font-weight:400}
.dcard .rsn.sans,.dcard .rsn.rounded{font-size:calc(12px + var(--ts,0px));font-weight:var(--tw,600);line-height:1.3}
.dcard .rsn.sans{font-family:var(--tf)}
.dcard .sub{font-family:var(--tf);font-size:calc(11.5px + var(--ts,0px))}
.dcard .cb{font-family:var(--tf);font-size:calc(12px + var(--ts,0px));font-weight:var(--tw,600);white-space:nowrap}
#tflist{max-height:150px;overflow:auto;border:1px solid #e0e0e4;border-radius:6px;padding:2px}
#tflist button{display:block;width:100%;text-align:left;border:0;border-radius:4px;font-size:13px;padding:3px 7px;background:transparent}
#tflist button:hover{background:#f1f1f3}#tflist button.on{background:#222;color:#fff}
#tfnote{font-size:10.5px;color:#a33;min-height:13px}

.dcard .rsn.sans{font-family:var(--tfh);font-weight:var(--twh,600);font-size:calc(12px + var(--ts,0px) + var(--tfhs,0px))}
.dcard .rsn.jbm{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:calc(11px + var(--ts,0px));color:#f1f0e6;opacity:.92;letter-spacing:0}

const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };

  const g = Math.max(0.6, t * 0.18), hh = t / 2;

  const ym = y + h / 2;
  const P = {
    a: hor(y + hh), g: hor(ym), d: hor(y + h - hh),
    f: ver(x + hh, y, ym), b: ver(x + w - hh, y, ym), e: ver(x + hh, ym, y + h), c: ver(x + w - hh, ym, y + h),
  };

  for (const k of 'abcdefg') {
    const lit = on.includes(k);
    if (!lit && !ghost) continue;
    ctx.globalAlpha = lit ? 1 : ghostA; ctx.fillStyle = ink;
    ctx.beginPath(); P[k].forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill();
  }

}

// draws caps text with 14-segment glyphs in px space; returns advance end. ghost>0 draws unlit segments at that alpha.
function seg14Text(ctx, str, x, yTop, capH, adv, S, color, alpha, ghost) {
  const w = capH * 0.56, t = Math.max(1, Math.round(capH * 0.11 * S)), g = t * 0.55;
  ctx.lineCap = 'round'; ctx.lineWidth = t; ctx.strokeStyle = color;
  let cx = x * S;
  for (const raw of str.toUpperCase()) {
    const on = (S14[raw] || '').match(/g1|g2|[a-fh-m]/g) || [];
    if (raw !== ' ') {
      const L = seg14Lines(cx + t / 2, yTop * S + t / 2, w * S - t, capH * S - t);
      for (const k in L) {
        const lit = on.includes(k); if (!lit && !(ghost > 0)) continue;
        const [x0, y0, x1, y1] = L[k], dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;

    }
    cx += adv * S;
  }

// silhouette polygon: capsule and mid are circular corners (e=1); squircle is a superellipse corner (continuous curvature)
function shapePoly(kind, x, y, w, h, hr) {
  hr = hr || h; let a, e;
  if (kind === 'capsule') { a = Math.min(hr / 2, h / 2, w / 2); e = 1; }
  else if (kind === 'mid') { a = Math.min(0.4 * hr, h / 2, w / 2); e = 1; }
  else { a = Math.min(0.34 * hr * 1.32, h / 2, w / 2); e = 0.5; }
  const pts = [], N = 22, cs = [[x + w - a, y + a, -90], [x + w - a, y + h - a, 0], [x + a, y + h - a, 90], [x + a, y + a, 180]];
  for (const [cx, cy, deg0] of cs) for (let i = 0; i <= N; i++) {
    const t = (deg0 + 90 * i / N) * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    pts.push([cx + a * Math.sign(c) * Math.pow(Math.abs(c), e), cy + a * Math.sign(s) * Math.pow(Math.abs(s), e)]);
  }
  return pts;
}

}

function mk(host, key) { const p = new Pill(host, key, { S: PX ? zoom : zoom * DPR, css: PX ? zoom / DPR : zoom }); p.onButton = id => onButton(id); return p; }
function buildGallery() {
  for (const p of pills) p.host.remove(); pills.length = 0; dockPill = null;
  const gal = $('#gal'); gal.innerHTML = ''; gal.style.gridTemplateColumns = `repeat(auto-fill,minmax(${CW * zoom + 16}px,1fr))`;
  const mats = matsToShow();
  for (const key of ORDER) {
    const cfg = DIRS[key] || REF[key];
    const card = document.createElement('div'); card.className = 'card' + (key === selKey ? ' sel' : ''); card.dataset.key = key;
    card.innerHTML = `<span class="nm">${cfg.name}</span><span class="bl">${cfg.blurb}</span><div class="hosts"></div>`;
    card.querySelector('.nm').onclick = () => { selKey = key; buildGallery(); buildDock(); buildPanel(); };
    const hosts = card.querySelector('.hosts');
    for (const m of (cfg.ref ? [mats[0]] : mats)) { const h = document.createElement('div'); h.className = 'pillwrap'; hosts.appendChild(h); const p = mk(h, key); p.mat = Opt.material === 'all' ? m : null; pills.push(p); if (cfg.ref && m !== mats[0]) { p.ref = true; } }
    gal.appendChild(card);
  }
  syncState();
}
function buildDock() {
  const w = $('#dockpill'); if (dockPill) { const i = pills.indexOf(dockPill); if (i >= 0) pills.splice(i, 1); }
  w.innerHTML = ''; const dh = document.createElement('div'); dh.className = 'pillwrap'; w.appendChild(dh); dockPill = mk(dh, selKey); pills.push(dockPill);
  $('#dockwrap').style.setProperty('--z', zoom); syncState();
}
let current = { content: 'rec', text: '', visible: false };
function syncState() { for (const p of pills) { if (current.visible) { p.show(current.content, current.text); p.phase = 'shown'; p.tPhase = 999; p.vis = 1; } } }

let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function apply(content, text) { current.content = content; current.text = text || ''; current.visible = true; for (const p of pills) p.show(content, text); }
const cmd = {
  appear() { clearTimers(); for (const p of pills) { p.hide(); p.phase = 'hidden'; p.vis = 0; } current.visible = false; setTimeout(() => apply('rec'), 30); },
  hold() { clearTimers(); apply('rec'); },
  lock() { clearTimers(); apply('locked'); },
  proc() { clearTimers(); apply('proc'); },
  msg(t) { clearTimers(); apply('msg', t); if ($('#auto').checked) later(T.msgAutoHide + 800, () => cmd.hide()); },
  err(t) { clearTimers(); apply('err', t || 'No microphone'); },
  record() { clearTimers(); apply('record', 'New best'); if ($('#auto').checked) later(T.record + 900, () => cmd.hide()); },
  hide() { clearTimers(); current.visible = false; for (const p of pills) p.hide(); },
};
function onButton(id) {
  if (id === 'cancel') { clearTimers(); apply('msg', 'Cancelled'); later(1100, cmd.hide); }
  else { clearTimers(); apply('proc'); later(900, () => { apply('msg', 'Copied'); later(1200, cmd.hide); }); }
}

/* ---------- spec panel ---------- */
function buildPanel() {
  const p = new Pill(document.createElement('div'), selKey, { S: 1, css: 1 }); p.phase = 'shown';
  const cfg = p.cfg, rows = [];
  const add = (a, b) => rows.push(`<tr><td>${a}</td><td>${b}</td></tr>`);
  const kind = p.kind;
  add('Selected', `<b>${cfg.name}</b>, ${cfg.blurb}`);
  if (cfg.ref) { add('Size', cfg.id === 'classic' ? '97 x 28 pt (locked 137)' : '146 x 32 pt'); add('Note', 'Reference only: a faithful approximation of the shipped pill.'); }
  else {
    const Lr = p.layout('rec'), Ll = p.layout('locked');
    p.text = 'TOO SHORT'; const Lm = p.layout('msg', 'TOO SHORT');
    const H = cfg.H, rr = kind === 'capsule' ? H / 2 : kind === 'mid' ? 0.4 * H : 0.34 * H;
    add('Size (pt)', `held ${Math.round(Lr.W)} x ${H}, locked ${Math.round(Ll.W)} x ${H}, "TOO SHORT" ${Math.round(Lm.W)} x ${H}`);
    add('Silhouette', `${kind}, corner ${rr.toFixed(1)} pt` + (kind === 'squircle' ? ' (superellipse, exponent n=4, extent ' + (rr * 1.32).toFixed(1) + ' pt)' : ''));
    add('Controls', `20 x 20 pt, ${kind === 'capsule' ? 'discs' : kind === 'mid' ? 'rounded squares r=8' : 'squircles'}, 3 pt apart, 5 pt from the right edge; finish = ${Opt.finish}`);
    if (cfg.plain) add('Readout', `${cfg.cols} vector bars, ${cfg.dw} pt wide, ${cfg.px} pt pitch, rounded caps, centre-mirrored (${cfg.rows} rows of ${cfg.py} pt). Text is the system face: REC 9.5 px/600, clock 12 px/500 tabular, message 13 px/600.`);
    else add('Readout', `${cfg.cols} x ${cfg.rows} ${cfg.mode} dot grid, dot ${cfg.dw} x ${cfg.dh} pt (${cfg.shape === 'round' ? 'round' : 'soft square'}), pitch ${cfg.px} x ${cfg.py} pt. Text 5x7 (14 pt caps) and 3x5 (10 pt) at 2 pt pitch; clock ${cfg.timeStyle === 'seg' ? '7-segment 6 x 11 pt, ghost 8s' : '3x5 dot matrix'}.`);
    const col = p.col, th = THEMES[p.mi.th];
    add('Colour', `${col.name}: ink ${col.ink}, REC ${col.rec}, error ${col.err}, ghost alpha ${col.ghost}${col.glow ? ', glow ' + col.glow + ' ' + cfg.glowPt + ' pt' : ''}`);
    add('Chrome', `body ${th.body[0]} to ${th.body[1]}, hairline ${th.stroke}, shadow y4 blur12 + contact y0.8 blur2`);
  }
  add('Material', Opt.material === 'all' ? 'comparing all four' : (MATS.find(m => m[0] === Opt.material) || [])[1]);
  const note = (Opt.material === 'glass' || Opt.material === 'smoke' || Opt.material === 'all') ? '<div class="note">Glass here is a CSS approximation of macOS 26 Liquid Glass: backdrop blur + saturation, a specular rim brighter at the top-left, a soft bottom inner shadow. It does not refract or lens the edge. The shipping app would use the system glass material (NSGlassEffectView) on macOS 26 and fall back to the solid body elsewhere.</div>' : '';
  $('#panel').innerHTML = '<h3>Spec</h3><table>' + rows.join('') + '</table>' + note;
}

/* ---------- controls ---------- */
function btnRow(el, items, onclick, active) {
  el.innerHTML = ''; for (const [v, label] of items) { const b = document.createElement('button'); b.textContent = label; b.dataset.v = v; if (v === active) b.classList.add('on'); b.onclick = () => { onclick(v); [...el.children].forEach(c => c.classList.toggle('on', c.dataset.v === v)); }; el.appendChild(b); }
}
function init() {
  btnRow($('#zoom'), [['1', '1x'], ['2', '2x'], ['4', '4x']], v => { zoom = +v; rebuild(); }, String(zoom));
  btnRow($('#bg'), [['light', 'Light window'], ['dark', 'Dark window'], ['photo', 'Busy photo']], v => { bgName = v; applyBg(); buildPanel(); }, bgName);
  btnRow($('#shape'), [['default', 'As designed'], ['capsule', 'Capsule'], ['mid', 'In-between'], ['squircle', 'Squircle']], v => { Opt.shape = v; buildPanel(); }, Opt.shape);
  btnRow($('#mat'), MATS, v => { Opt.material = v; rebuild(); }, Opt.material);
  btnRow($('#col'), [['', 'As designed'], ['lcd', 'Pager LCD'], ['amber', 'Amber'], ['red', 'Red'], ['white', 'Cool white']], v => { Opt.color = v || null; buildPanel(); }, '');
  btnRow($('#lab'), [['dots', 'Dot matrix'], ['pixel', 'Solid pixel'], ['seg', '14-segment'], ['rounded', 'Rounded sans'], ['sans', 'System sans'], ['jbm', 'JetBrains Mono']], v => { Opt.label = v; if (cardCase) cardRender('noanim'); buildPanel(); }, Opt.label);
  btnRow($('#cbtn'), [['calm', 'Calm'], ['amber', 'Amber']], v => { Opt.cardBtn = v; for (const o of cardFrames) o.sig = ''; }, Opt.cardBtn);
  const tl = $('#tflist');
  { const b = document.createElement('button'); b.className = 'preset'; b.dataset.v = 'systema'; b.textContent = 'Systema set: serif headers, sans body, mono data'; b.onclick = () => { Opt.tf.preset = 'systema'; Opt.tf.custom = ''; $('#tfany').value = ''; tfApply(); }; tl.appendChild(b); }
  for (const [k, name, stack, fl] of TF_OPTS) { const b = document.createElement('button'); b.textContent = name; b.dataset.v = k; b.style.fontFamily = stack; if (fl.inst) b.dataset.inst = fl.inst; b.onclick = () => { Opt.tf.family = k; Opt.tf.preset = ''; Opt.tf.custom = ''; $('#tfany').value = ''; tfApply(); }; tl.appendChild(b); }
  $('#tfany').value = Opt.tf.custom || ''; $('#tfany').oninput = e => { Opt.tf.custom = e.target.value; tfApply(); };
  btnRow($('#tfw'), [['400', 'Regular'], ['500', 'Medium'], ['600', 'Semibold']], v => { Opt.tf.weight = +v; tfApply(); }, String(Opt.tf.weight));
  btnRow($('#tfs'), [['-1', '-1 pt'], ['0', '0'], ['1', '+1 pt']], v => { Opt.tf.size = +v; tfApply(); }, String(Opt.tf.size));
  tfApply(true); const reTF = () => { _instCache = {}; _pmKey = ''; tfApply(true); };
  if (document.fonts) { Promise.all(EMBED_LOADS.map(f => document.fonts.load(f))).then(reTF).catch(reTF); document.fonts.ready.then(reTF); }
  btnRow($('#fin'), [['stop', 'Stop square'], ['check', 'Check mark']], v => { Opt.finish = v; buildPanel(); }, Opt.finish);
  btnRow($('#long'), [['grow', 'Grow taller'], ['scroll', 'Scroll']], v => { Opt.long = v; }, 'grow');
  Opt.long = 'grow';
  const A = $('#acts'); const mkb = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; A.appendChild(b); };
  mkb('Appear', cmd.appear); mkb('Hold', cmd.hold); mkb('Locked', cmd.lock); mkb('Processing', cmd.proc); mkb('New record', cmd.record); mkb('Error', () => cmd.err('No microphone')); mkb('Hide', cmd.hide);
  const P = $('#pre'); const mkp = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; P.appendChild(b); };
  mkp('Too short', () => cmd.msg('Too short')); mkp('Copied', () => cmd.msg('Copied')); mkp('Cancelled', () => cmd.msg('Cancelled'));
  mkp('Long message', () => cmd.msg('Microphone disconnected, 14 seconds saved to history'));
  $('#send').onclick = () => cmd.msg($('#txt').value || 'Hello');
  $('#lvl').oninput = e => { Voice.gain = +e.target.value / 100; };
  $('#mic').onclick = async () => { const b = $('#mic'); if (Voice.mic) { Voice.disableMic(); b.textContent = 'Use microphone'; b.classList.remove('on'); return; } const ok = await Voice.enableMic(); b.textContent = ok ? 'Microphone on (click to stop)' : 'Use microphone (blocked, simulating)'; b.classList.toggle('on', ok); };
  $('#dockchk').onchange = e => { $('#dockwrap').style.display = e.target.checked ? '' : 'none'; };
  const C = $('#cardbtns'); for (const k in CARD_CASES) { const b = document.createElement('button'); b.textContent = CARD_CASES[k].label; b.onclick = () => showCard(k); C.appendChild(b); }
  const lb = document.createElement('button'); lb.textContent = 'Long transcript'; lb.onclick = () => { cardLong = !cardLong; lb.classList.toggle('on', cardLong); if (cardCase) cardRender('noanim'); }; C.appendChild(lb);
  const hb = document.createElement('button'); hb.textContent = 'Dismiss card'; hb.onclick = cardDismiss; C.appendChild(hb);
  applyBg(); rebuild();
}
function tfApply(noSave) {
  if (!noSave) saveTF();
  for (const b of $('#tflist').children) { b.classList.toggle('on', !Opt.tf.custom && (Opt.tf.preset === 'systema' ? b.dataset.v === 'systema' : b.dataset.v === Opt.tf.family)); if (b.dataset.inst) b.classList.toggle('dim', !fontInstalled(b.dataset.inst)); }
  const c = (Opt.tf.custom || '').trim(); $('#tfnote').textContent = c && !fontInstalled(c) ? `"${c}" is not installed, using the system font.` : '';
  for (const p of pills) { p._tmKey = null; p._tm = null; }
  for (const o of cardFrames) o.sig = '';
}
function rebuild() { buildGallery(); buildCards(); buildDock(); buildPanel(); $('#dockwrap').style.setProperty('--z', zoom); }
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now; const lv = Voice.step(dt);
  for (const p of pills) { p.step(dt, lv); p.render(); }
  cardTick();
  requestAnimationFrame(frame);
}
window.addEventListener('DOMContentLoaded', () => { if (q.get('sheet')) return; init(); requestAnimationFrame(frame); setTimeout(() => cmd.hold(), 150); });
</script></body></html>
