<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mouthtype audio file transcription</title>
<style>body{font:16px system-ui;background:#f4f4f4;color:#181818;max-width:700px;margin:48px auto;padding:24px}main{background:white;border:1px solid #ddd;border-radius:12px;padding:28px}button{font:inherit;padding:8px 16px;margin-right:8px}textarea{box-sizing:border-box;width:100%;height:260px;font:16px/1.5 system-ui;padding:12px;margin:16px 0}small,p{color:#666;line-height:1.5}.status{min-height:48px;padding:16px 0}</style>
<main><h1>Transcribe an audio file.</h1><p>Choose a WAV, AIFF or M4A file. Up to 10 minutes and 512 MB. Your original stays unchanged.</p><button id="choose">Choose Audio File…</button><div class="status" id="status">Nothing selected.</div><button id="cancel" disabled>Cancel</button><textarea id="result" readonly placeholder="Your transcript appears here. Nothing is pasted automatically." aria-label="Transcript"></textarea><button id="copy" disabled>Copy</button><button id="save" disabled>Save Text…</button><p>Local speech recognition. Raw transcript. No microphone access needed.</p></main>
<script>const q=id=>document.getElementById(id);q('choose').onclick=()=>{q('status').textContent='Preparing example.wav…';q('cancel').disabled=false;q('result').value='';q('copy').disabled=true;q('save').disabled=true;};q('cancel').onclick=()=>{q('status').textContent='Cancelled. Your original file is unchanged.';q('cancel').disabled=true;};</script></html>
