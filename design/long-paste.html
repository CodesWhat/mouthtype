<!doctype html><html lang="en"><meta charset="utf-8"><title>Mouthtype paste options</title><style>body{background:#eeeae4;color:#262621;font:15px -apple-system,sans-serif;padding:60px}main{max-width:580px;margin:auto}h1{font:40px Georgia}section{background:#fbfaf7;border:1px solid #d5d2ca;border-radius:12px;padding:20px;box-shadow:0 10px 24px #0001}h2{font-size:14px;margin:0 0 16px;color:#72726b}label{display:flex;gap:12px;font-weight:600}p{color:#66665f;line-height:1.6}.hint{border-top:1px solid #ddd9d1;padding-top:16px;font-size:13px}</style><main><h1>Paste options</h1><section><h2>Mouthtype menu → Paste Options</h2><label><input type="checkbox"> Split long pastes in Terminal</label><p>For terminal apps that lose text from a large paste. Off by default; applies to this app’s windows.</p><p class="hint">Waits between parts. Stops if you type, move focus, or copy something. Partial pastes offer Copy and never retry automatically. No Return key is sent.</p></section></main></html>
