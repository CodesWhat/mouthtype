<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouthtype · Phrase replacements prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#deddd8;color:#242723;font:14px -apple-system,BlinkMacSystemFont,sans-serif;padding:55px 25px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cdcec7;border-radius:7px;background:#fff;padding:8px 15px;color:inherit}button:disabled{opacity:.4;cursor:default}button:hover:enabled{filter:brightness(.97)}main{max-width:980px;margin:auto;background:#fafaf7;border:1px solid #bdbeb7;border-radius:13px;box-shadow:0 20px 70px #24272325;overflow:hidden}.titlebar{height:43px;background:#f1f1ec;border-bottom:1px solid #dedfd8;display:flex;align-items:center;padding:0 17px;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#ff6058}.dot:nth-child(2){background:#ffbd2d}.dot:nth-child(3){background:#28c840}.appname{margin:auto;padding-right:50px;color:#72766d;font-size:12px}header{display:flex;align-items:center;justify-content:space-between;padding:29px 31px 25px;border-bottom:1px solid #dedfd8}h1{font:30px Georgia,serif;margin:0 0 9px}p{color:#6a7065;line-height:1.6;margin:0}.primary{background:#38544b;border-color:#38544b;color:#fff}.workspace{display:grid;grid-template-columns:285px 1fr;min-height:415px}aside{background:#f1f2ed;border-right:1px solid #dedfd8;padding:20px 13px}h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#777c72;margin:0 12px 15px}.phrase{width:100%;text-align:left;border:0;background:transparent;margin:0 0 6px;padding:13px;border-radius:8px;line-height:1.5;overflow-wrap:anywhere}.phrase.selected{background:#e0e7de}.phrase strong{font-weight:550;display:block}.phrase small{color:#72796d;font-size:12px;white-space:pre-wrap}.empty{padding:10px 13px}.editor{padding:28px 32px 23px}label{display:block;font-size:13px;font-weight:550;margin-bottom:9px}input,textarea{width:100%;background:white;border:1px solid #c9cdc3;border-radius:7px;color:#242723;padding:11px 12px;outline:none}input:focus,textarea:focus{border-color:#557564;box-shadow:0 0 0 3px #55756418}textarea{resize:vertical;min-height:145px;line-height:1.6;margin-bottom:10px}input{margin-bottom:25px}.variables{display:flex;gap:7px;margin:13px 0 25px}.variables button{font-size:12px;padding:5px 10px;background:#f0f2ec}code{font:12px ui-monospace,monospace}.actions{border-top:1px solid #e0e2d9;display:flex;align-items:center;gap:9px;padding-top:20px}.actions .delete{margin-right:auto;color:#a54134;background:transparent;border-color:transparent}.footnote{padding:15px 31px;border-top:1px solid #dedfd8;font-size:12px;color:#73786d;background:#f6f6f1}.error{color:#ae392a;margin-bottom:13px;min-height:20px}.badge{font-size:11px;color:#74806e;border:1px solid #d2d8cc;padding:5px 9px;border-radius:20px;margin-left:12px;vertical-align:middle}@media(max-width:750px){body{padding:10px}.workspace{grid-template-columns:220px 1fr}.editor{padding:25px 20px}header{padding:25px 20px}h1{font-size:25px}}
</style>
<main><div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="appname">Mouthtype</span></div>
<header><div><h1>Phrase replacements <span class="badge">On this Mac</span></h1><p>Say a short phrase. Insert exactly what you saved.</p></div><button id="new">＋ New phrase</button></header>
<div class="workspace"><aside><h2>Saved phrases</h2><div id="list"></div></aside>
<form class="editor" id="form"><label for="trigger">When I say</label><input id="trigger" placeholder="For example, my work email" autocomplete="off">
<label for="expansion">Insert</label><textarea id="expansion" placeholder="The exact text to insert" spellcheck="false"></textarea>
<p style="font-size:12px">Use <code>{date}</code> for today’s date or <code>{clipboard}</code> for clipboard text.</p>
<div class="variables"><button type="button" data-value="{date}">Insert date</button><button type="button" data-value="{clipboard}">Insert clipboard</button></div>
<p id="error" class="error" role="alert"></p><div class="actions"><button type="button" id="delete" class="delete">Delete phrase</button><button type="button" id="cancel">Cancel</button><button id="save" class="primary">Save phrase</button></div></form></div>
<div class="footnote">Replacements work on their own or within a sentence. Their text stays unchanged during cleanup.</div></main>
<script>
const rows=[{trigger:'my work email',expansion:'name@example.com'},{trigger:'today’s date',expansion:'{date}'}];let selected=0;const $=id=>document.getElementById(id);const key=s=>s.trim().toLowerCase().split(/\s+/).join(' ');
function render(){const list=$('list');list.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='No phrases yet. Add your first phrase to get started.';list.append(p)}rows.forEach((row,i)=>{const b=document.createElement('button');b.type='button';b.className='phrase'+(i===selected?' selected':'');const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=row.trigger;small.textContent=row.expansion;b.append(strong,small);b.onclick=()=>{if(dirty()&&!confirm('Discard your unsaved changes?'))return;selected=i;render();load()};list.append(b)});$('delete').disabled=selected===null}
function load(){$('trigger').value=selected===null?'':rows[selected].trigger;$('expansion').value=selected===null?'':rows[selected].expansion;$('error').textContent='';update()}
function dirty(){return selected===null?Boolean($('trigger').value||$('expansion').value):$('trigger').value!==rows[selected].trigger||$('expansion').value!==rows[selected].expansion}
function update(){$('save').disabled=!dirty()||!$('trigger').value.trim()||!$('expansion').value.trim();$('cancel').disabled=!dirty()}
$('new').onclick=()=>{if(dirty()&&!confirm('Discard your unsaved changes?'))return;selected=null;render();load()};$('cancel').onclick=load;['trigger','expansion'].forEach(id=>$(id).oninput=update);
$('form').onsubmit=event=>{event.preventDefault();const trigger=$('trigger').value.trim().split(/\s+/).join(' '),expansion=$('expansion').value;if(rows.some((r,i)=>i!==selected&&key(r.trigger)===key(trigger))){$('error').textContent='A phrase with this trigger already exists.';return}if(selected===null){rows.push({trigger,expansion});selected=rows.length-1}else rows[selected]={trigger,expansion};render();load()};
$('delete').onclick=()=>{if(selected===null||!confirm('Delete this phrase?'))return;rows.splice(selected,1);selected=rows.length?0:null;render();load()};document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{const a=$('expansion');a.setRangeText(b.dataset.value,a.selectionStart,a.selectionEnd,'end');update()});render();load();
</script></html>
