name: Security checks

on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  schedule:
    - cron: '24 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified security tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-tools"
          cd "$RUNNER_TEMP/security-tools"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -o zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo 'd185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  zizmor.tar.gz' | sha256sum --check --strict
          tar -xzf zizmor.tar.gz zizmor
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Scan complete Git history for secrets
        env:
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: gitleaks git --redact --no-banner --gitleaks-ignore-path /dev/null
      - name: Validate workflow syntax and security
        run: |
          actionlint
          zizmor --no-progress .github/workflows
      - name: Run release helper checks
        run: python3 -W error::ResourceWarning -m unittest discover -s Tests/ReleaseTests -p 'test_*.py'

  swift-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.4@sha256:6fbd5978b56a5a9ff05a48f8f678079fc45be496ecda15b4e74e8944fab857be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Swift formatting
        run: swift format lint --strict --recursive Sources Tests

  website-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit locked direct and transitive website dependencies
        working-directory: website
        run: ../scripts/npm-audit-retry.sh --package-lock-only --audit-level=high
