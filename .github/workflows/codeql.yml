name: CodeQL

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests scan Swift only when something the package build compiles changed.
      # Pushes to dev/** skip it because the PR into dev already scanned that diff.
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "${REF#refs/heads/dev/}" != "$REF" ]; then
            echo "swift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paths are read NUL-delimited from a file and never echoed raw: git quotes non-ASCII names in its default output,
          # and a file named like a workflow command (::add-mask::true) would be run by the runner if printed.
          git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"
          pattern='^(Sources/|Package\.swift$|Package@swift-.*\.swift$|Package\.resolved$|\.github/workflows/codeql\.yml$)'
          swift=false
          # Match case-insensitively: the macOS checkout is, so sources/x.swift lands in Sources/ and gets compiled.
          shopt -s nocasematch
          while IFS= read -r -d '' file; do
            if [[ "$file" =~ $pattern ]]; then
              swift=true
            fi
          done < "$RUNNER_TEMP/changed"
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          tr '\0' '\n' < "$RUNNER_TEMP/changed"
          echo "::$marker::"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: python
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Swift is the expensive one (macOS, up to 3h). A workflow-level paths filter would leave
  # the required "Analyze (swift)" check missing and block merges, so gate at job level
  # instead: a skipped job with the same name still satisfies the required check.
  analyze-swift:
    name: Analyze (swift)
    needs: changes
    # Skip only on an explicit false. If change detection fails, or its output is missing or masked, scan anyway rather
    # than report a skipped (passing) check.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.swift != 'false')
    # CodeQL runs natively on Intel, with 14 GB RAM instead of the ARM runner's 7 GB.
    runs-on: macos-26-intel
    timeout-minutes: 180
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Traced Swift analysis requires macOS and Xcode 26 or earlier.
      - name: Select supported Swift toolchain
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # Prebuild the package and Metal shaders, then clear project target outputs below.
      # Each CodeQL extractor loads SDK type information; serialize builds to bound memory use.
      - name: Prebuild dependencies
        run: swift build --triple arm64-apple-macosx26.0 --disable-sandbox --jobs 1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual

      - name: Build Swift package
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-swift-diagnostics"
          find .build -maxdepth 6 -type d \
            \( -name 'Mouthtype*.build' -o -name 'FnRemapKit*.build' -o -name 'mouthtype-*.build' \) -prune -exec rm -rf {} +
          # Invoke the selected Xcode compiler directly.
          # Keep compiler flags identical to the prebuild so dependencies stay cached.
          "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" \
            build --triple arm64-apple-macosx26.0 --disable-sandbox --jobs 1 \
            2>&1 | tee "$RUNNER_TEMP/codeql-swift-diagnostics/build.log"

      - name: Preserve Swift build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-diagnostics
          path: ${{ runner.temp }}/codeql-swift-diagnostics
          retention-days: 7
          if-no-files-found: warn

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
