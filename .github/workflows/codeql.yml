name: CodeQL

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: python
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          # Traced Swift analysis requires macOS and Xcode 26 or earlier.
          - language: swift
            runner: macos-26
            build-mode: manual
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select supported Swift toolchain
        if: matrix.language == 'swift'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        if: matrix.language == 'swift'
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # CodeQL's tracer is x86_64 and breaks the arm64 Metal compiler, so build the dependencies
      # (including mlx-swift's shaders) untraced first. Only our own targets get rebuilt under tracing.
      - name: Prebuild dependencies
        if: matrix.language == 'swift'
        run: swift build --triple arm64-apple-macosx26.0 --disable-sandbox

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          debug: ${{ matrix.language == 'swift' }}

      - name: Build Swift package
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          find .build -maxdepth 6 -type d \
            \( -name 'Mouthtype*.build' -o -name 'FnRemapKit*.build' -o -name 'mouthtype-*.build' \) -prune -exec rm -rf {} +
          python3 -u - <<'PYTHON'
          import os
          import signal
          import subprocess
          import time
          from pathlib import Path

          destination = Path(os.environ["DIAGNOSTICS_DIR"])
          destination.mkdir(parents=True, exist_ok=True)
          with (destination / "build.log").open("w") as output:
              compiler = str(Path(os.environ["DEVELOPER_DIR"]) /
                             "Toolchains/XcodeDefault.xctoolchain/usr/bin/swift")
              for label, executable in [("launcher", "swift"), ("compiler", compiler)]:
                  print(f"Checking traced {label}: {executable}", file=output, flush=True)
                  probe = subprocess.Popen([executable, "--version"], stdout=output,
                                           stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      probe_result = probe.wait(timeout=120)
                  except subprocess.TimeoutExpired:
                      print(f"{label} version probe timed out", file=output, flush=True)
                      with (destination / f"{label}-processes.log").open("w") as processes:
                          subprocess.run(["ps", "-axo", "pid,ppid,pcpu,pmem,rss,etime,comm"],
                                         stdout=processes, stderr=subprocess.STDOUT, timeout=15)
                      try:
                          subprocess.run(["sample", str(probe.pid), "1", "1", "-file",
                                          str(destination / f"{label}-sample.txt")],
                                         stdout=output, stderr=subprocess.STDOUT, timeout=15)
                      except subprocess.TimeoutExpired:
                          print("Process sampling timed out", file=output, flush=True)
                      probe_result = 124
                  finally:
                      if probe.poll() is None:
                          os.killpg(probe.pid, signal.SIGKILL)
                          probe.wait(timeout=30)
                  if label == "compiler" and probe_result:
                      raise SystemExit(probe_result)
              command = [compiler, "build", "--triple", "arm64-apple-macosx26.0",
                         "--disable-sandbox", "--verbose"]
              print("Starting traced package build", file=output, flush=True)
              build = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                       start_new_session=True)
              deadline = time.monotonic() + 30 * 60
              try:
                  while True:
                      try:
                          result = build.wait(timeout=min(60, max(0, deadline - time.monotonic())))
                          break
                      except subprocess.TimeoutExpired:
                          with (destination / "processes.log").open("a") as processes:
                              print(time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                    file=processes, flush=True)
                              subprocess.run(["ps", "-axo", "pid,ppid,pcpu,pmem,rss,etime,comm"],
                                             stdout=processes, stderr=subprocess.STDOUT, timeout=15)
                          print("Traced build still running; latest output:", flush=True)
                          subprocess.run(["tail", "-n", "20", str(destination / "build.log")],
                                         timeout=15, check=True)
                          if time.monotonic() >= deadline:
                              raise TimeoutError("Traced build exceeded its 30-minute diagnostic limit")
              finally:
                  if build.poll() is None:
                      os.killpg(build.pid, signal.SIGKILL)
                      build.wait(timeout=30)
                  subprocess.run(["tail", "-n", "60", str(destination / "build.log")], timeout=15)
              raise SystemExit(result)
          PYTHON
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/codeql-swift-diagnostics

      - name: Preserve Swift build diagnostics
        if: always() && matrix.language == 'swift'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-diagnostics
          path: ${{ runner.temp }}/codeql-swift-diagnostics
          retention-days: 7
          if-no-files-found: warn

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
