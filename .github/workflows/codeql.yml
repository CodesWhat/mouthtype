name: CodeQL

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: python
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          # Traced Swift analysis requires macOS and Xcode 26 or earlier.
          - language: swift
            # CodeQL runs natively on Intel, with 14 GB RAM instead of the ARM runner's 7 GB.
            runner: macos-26-intel
            build-mode: manual
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select supported Swift toolchain
        if: matrix.language == 'swift'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        if: matrix.language == 'swift'
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # Prebuild dependencies, including mlx-swift's Metal shaders, before tracing.
      # Only our own targets get rebuilt under tracing.
      - name: Prebuild dependencies
        if: matrix.language == 'swift'
        run: swift build --triple arm64-apple-macosx26.0 --disable-sandbox

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Swift package
        if: matrix.language == 'swift'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-swift-diagnostics"
          find .build -maxdepth 6 -type d \
            \( -name 'Mouthtype*.build' -o -name 'FnRemapKit*.build' -o -name 'mouthtype-*.build' \) -prune -exec rm -rf {} +
          # The system Swift launcher stalls under tracing. Use the selected compiler directly.
          # Keep compiler flags identical to the prebuild so dependencies stay cached.
          "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" \
            build --triple arm64-apple-macosx26.0 --disable-sandbox \
            2>&1 | tee "$RUNNER_TEMP/codeql-swift-diagnostics/build.log"

      - name: Preserve Swift build diagnostics
        if: always() && matrix.language == 'swift'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-diagnostics
          path: ${{ runner.temp }}/codeql-swift-diagnostics
          retention-days: 7
          if-no-files-found: warn

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
