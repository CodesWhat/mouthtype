name: CodeQL

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: python
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          # Traced Swift analysis requires macOS and Xcode 26 or earlier.
          - language: swift
            # CodeQL runs natively on Intel, with 14 GB RAM instead of the ARM runner's 7 GB.
            runner: macos-26-intel
            build-mode: manual
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select supported Swift toolchain
        if: matrix.language == 'swift'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        if: matrix.language == 'swift'
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # Prebuild dependencies, including mlx-swift's Metal shaders, before tracing.
      # Only our own targets get rebuilt under tracing.
      - name: Prebuild dependencies
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/codeql-build-context.py" <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "codeql-swift-diagnostics"
          phase = sys.argv[1]
          destination = root / phase
          destination.mkdir(parents=True, exist_ok=True)
          if phase != "monitor":
              for index, path in enumerate(sorted(Path(".build").glob("*/debug/description.json"))):
                  data = json.loads(path.read_text())
                  fields = ("executable", "moduleName", "otherArguments", "sources", "objects", "inputs", "outputs")
                  commands = {name: {key: value for key, value in command.items() if key in fields}
                              for name, command in data.get("swiftCommands", {}).items()}
                  (destination / f"plan-{index}.json").write_text(json.dumps(
                      {"path": str(path), "keys": list(data), "swiftCommands": commands}, indent=2))
              generated = sorted(Path(".build").glob("*/debug/swift-version-*.txt"))
              generated += sorted(Path(".build").glob("*/debug/*/DerivedSources/resource_bundle_accessor.swift"))
              paths = {}
              for index, path in enumerate(generated):
                  name = f"generated-{index}.txt"
                  (destination / name).write_bytes(path.read_bytes())
                  paths[name] = str(path)
              (destination / "generated-paths.json").write_text(json.dumps(paths, indent=2))
              if phase == "after":
                  diagnostics = Path(os.environ["RUNNER_TEMP"]) / "codeql_databases/swift/diagnostic/extractors"
                  for index, path in enumerate(sorted(diagnostics.rglob("*.jsonl"))):
                      (destination / f"extractor-diagnostic-{index}.jsonl").write_bytes(path.read_bytes())
              raise SystemExit(0)

          if os.getpgrp() != os.getpid():
              os.setsid()
          deadline = time.monotonic() + 18 * 60
          sample_after = [5 * 60, 10 * 60, 15 * 60]
          started = time.monotonic()
          iteration = 0
          while time.monotonic() < deadline:
              result = subprocess.run(["ps", "-axo", "pid,ppid,pcpu,pmem,rss,etime,comm"],
                                      capture_output=True, text=True, timeout=15, check=True)
              (destination / f"processes-{iteration}.txt").write_text(result.stdout)
              with (destination / f"memory-{iteration}.txt").open("w") as output:
                  subprocess.run(["sysctl", "hw.memsize", "hw.ncpu"], stdout=output,
                                 stderr=subprocess.STDOUT, timeout=15, check=True)
                  subprocess.run(["vm_stat"], stdout=output, stderr=subprocess.STDOUT,
                                 timeout=15, check=True)
              if sample_after and time.monotonic() - started >= sample_after[0]:
                  sample_after.pop(0)
                  candidates = []
                  for line in result.stdout.splitlines():
                      fields = line.split(None, 6)
                      if len(fields) == 7 and any(name in fields[6] for name in
                                                ("swift-frontend", "extractor.real", "swift-build")):
                          candidates.append((float(fields[2]), int(fields[0])))
                  for _, pid in sorted(candidates, reverse=True)[:2]:
                      with (destination / f"command-{iteration}-{pid}.txt").open("w") as output:
                          subprocess.run(["ps", "-ww", "-p", str(pid), "-o", "command="],
                                         stdout=output, stderr=subprocess.STDOUT, timeout=15)
                      try:
                          subprocess.run(["sample", str(pid), "1", "1", "-file",
                                          str(destination / f"stack-{iteration}-{pid}.txt")],
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
                      except subprocess.TimeoutExpired:
                          pass
              iteration += 1
              time.sleep(min(60, max(0, deadline - time.monotonic())))
          PYTHON
          swift build --triple arm64-apple-macosx26.0 --disable-sandbox
          python3 "$RUNNER_TEMP/codeql-build-context.py" before

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Swift package
        if: matrix.language == 'swift'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-swift-diagnostics"
          find .build -maxdepth 6 -type d \
            \( -name 'Mouthtype*.build' -o -name 'FnRemapKit*.build' -o -name 'mouthtype-*.build' \) -prune -print -exec rm -rf {} + \
            > "$RUNNER_TEMP/codeql-swift-diagnostics/removed-targets.txt"
          python3 "$RUNNER_TEMP/codeql-build-context.py" clean
          python3 "$RUNNER_TEMP/codeql-build-context.py" monitor \
            > "$RUNNER_TEMP/codeql-swift-diagnostics/monitor.log" 2>&1 &
          profiler_pid=$!
          cleanup_profiler() {
            kill -KILL -- "-$profiler_pid" 2>/dev/null || true
            kill -KILL "$profiler_pid" 2>/dev/null || true
            wait "$profiler_pid" 2>/dev/null || true
          }
          trap cleanup_profiler EXIT
          # Use the selected compiler, keeping the same flags as the prebuild.
          "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" \
            build --triple arm64-apple-macosx26.0 --disable-sandbox \
            2>&1 | tee "$RUNNER_TEMP/codeql-swift-diagnostics/build.log"

      - name: Record traced build plan
        if: always() && matrix.language == 'swift'
        run: |
          if [[ -f "$RUNNER_TEMP/codeql-build-context.py" ]]; then
            python3 "$RUNNER_TEMP/codeql-build-context.py" after
          fi

      - name: Preserve Swift build diagnostics
        if: always() && matrix.language == 'swift'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-diagnostics
          path: ${{ runner.temp }}/codeql-swift-diagnostics
          retention-days: 7
          if-no-files-found: warn

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
