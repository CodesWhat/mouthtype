name: Release Sign

# Signs the assets already attached to a GitHub release with keyless cosign
# and attaches Sigstore bundles (*.sigstore.json), plus a build provenance
# attestation. The original assets are only downloaded, never modified or
# re-uploaded, so Sparkle signatures and notarization stay intact.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign, e.g. v0.5.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-sign-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # gh release upload of the .sigstore.json bundles
      id-token: write      # cosign keyless signing and attestation OIDC
      attestations: write  # attest-build-provenance
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected release tag '${RELEASE_TAG}'"
            exit 1
          fi

      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assets"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/assets" \
            --exclude '*.sigstore.json'
          ls -l "${RUNNER_TEMP}/assets"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign assets
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundles"
          shopt -s nullglob
          files=("${RUNNER_TEMP}"/assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Release ${RELEASE_TAG} has no assets to sign"
            exit 1
          fi
          for f in "${files[@]}"; do
            cosign sign-blob --yes \
              --bundle "${RUNNER_TEMP}/bundles/$(basename "${f}").sigstore.json" "${f}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Upload signature bundles
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${RUNNER_TEMP}"/bundles/*.sigstore.json
