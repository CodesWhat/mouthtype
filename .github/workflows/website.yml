name: Website

on:
  push:
    branches: [main, 'dev/**']
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # Pull requests run the real job only when a path from the push filter changed; pushes always do.
      - id: gate
        uses: CodesWhat/.github/actions/changes-gate@f763dd4e8fea25a36892f4689f9f667adbbe197b
        with:
          patterns: |
            website/**
            .github/workflows/website.yml

  website:
    needs: changes
    # Skip only on an explicit false. If change detection fails, run anyway rather than report a skipped (passing) check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright image (matches @playwright/test 1.65.1): browsers and OS deps are baked in,
    # so there is no apt step. PRs and pushes run Chromium; schedule and dispatch run all three engines.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npm test
          else
            npm test -- --project=chromium
          fi
        env:
          # Firefox refuses to start as root when $HOME belongs to pwuser.
          HOME: /root
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_DIST: "1"
