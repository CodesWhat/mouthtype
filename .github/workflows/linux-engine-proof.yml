name: Linux engine proof

on:
  push:
    branches: [main, 'dev/**']
    paths: ["tools/linux-engine-proof/**", ".github/workflows/linux-engine-proof.yml"]
  pull_request:
    paths: ["tools/linux-engine-proof/**", ".github/workflows/linux-engine-proof.yml"]

permissions:
  contents: read

jobs:
  orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: No-model worker, cancellation and fixture checks
        run: python3 -W error::ResourceWarning -m unittest discover -s tools/linux-engine-proof -p 'test_*.py'

  arch-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: archlinux:base-20261011.0.609700@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
      options: --init
    steps:
      - name: Install signed Arch test prerequisites in the ephemeral container
        run: pacman -Syu --noconfirm --needed git python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual Arch userland and runtime versions
        run: |
          cat /etc/os-release
          uname -srm
          python --version
          getconf GNU_LIBC_VERSION
          pacman -Q git python glibc pacman archlinux-keyring
          pacman-conf SigLevel
      - name: Arch no-model worker, cancellation and fixture checks
        run: python -W error::ResourceWarning -m unittest discover -s tools/linux-engine-proof -p 'test_*.py'
