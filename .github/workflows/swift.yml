name: Swift

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The code uses Xcode 27 SDK APIs (for example the FoundationModels samplingMode label), and macos-26 only ships Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

  # Post-merge only. Hosted runners are memory-starved (7.5 GB, no swap), so timing flakes show up here that don't
  # happen locally. Those are tracked in the roadmap as T-2 and T-3, and the full suite runs locally at the release merge.
  test:
    if: github.event_name != 'pull_request'
    # The code uses Xcode 27 SDK APIs (for example the FoundationModels samplingMode label), and macos-26 only ships Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # MouthtypeSettingsUITests builds real Settings and preview windows and drives focus and key events through them.
      # The hosted runner has no GUI or accessibility session, so those tests fail there and the run can die before it
      # prints a Swift Testing summary. The target is built here and runs locally at the release merge.
      - name: Test with coverage
        run: scripts/swift-test.sh --enable-code-coverage --skip MouthtypeSettingsUITests

      - name: Coverage report
        run: |
          set -euo pipefail
          codecov_dir="$(dirname "$(swift test --show-codecov-path)")"
          profdata="$(find "$(dirname "$codecov_dir")" -name default.profdata -print -quit)"
          test -n "$profdata" || { echo "no default.profdata under $(dirname "$codecov_dir")" >&2; exit 1; }
          # The Xcode build system emits one .xctest bundle per test target, so pass each binary to llvm-cov.
          objects=()
          while IFS= read -r bundle; do
            binary="$bundle/Contents/MacOS/$(basename "$bundle" .xctest)"
            [ -f "$binary" ] || { echo "missing test binary $binary" >&2; exit 1; }
            objects+=("$binary")
          done < <(find "$(dirname "$codecov_dir")" -maxdepth 1 -name '*.xctest')
          test "${#objects[@]}" -gt 0 || { echo "no .xctest bundles beside $codecov_dir" >&2; exit 1; }
          xcrun llvm-cov report "${objects[0]}" "${objects[@]:1}" -instr-profile="$profdata" \
            -ignore-filename-regex='(\.build|Tests)/' > coverage-report.txt
          cat coverage-report.txt
          total="$(awk '/^TOTAL/ {print $(NF-3)}' coverage-report.txt)"
          echo "Total line coverage: $total"
          echo "Total line coverage: $total" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swift-coverage
          path: coverage-report.txt
          if-no-files-found: ignore
