name: Swift

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # Pull requests build and test only when something the package compiles, a test reads, or these jobs run changed.
      # Tests read design/, packaging/ and scripts/ from the checkout, so those count. Pushes and manual runs always run.
      # Matching is case-insensitive, like the macOS checkout.
      - id: gate
        uses: CodesWhat/.github/actions/changes-gate@b85ebce168f649bcd2fddf2ff0d433fb38e30866
        with:
          patterns: |
            Sources/**
            Tests/**
            design/**
            packaging/**
            scripts/**
            Package.swift
            Package@swift-*.swift
            Package.resolved
            .swift-format
            .github/workflows/swift.yml

  # Reuse a verified green run for the same tree (a merge push or a promotion PR) instead of rebuilding on macOS. verify
  # outputs reuse=true only for a trusted push run of this workflow on an identical tree, so receipts never come from pull
  # request runs. It gates build and test only. CodeQL, scans and release steps are other workflows and always run.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      reuse: ${{ steps.receipt.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: receipt
        uses: CodesWhat/.github/actions/tree-receipt/verify@b85ebce168f649bcd2fddf2ff0d433fb38e30866

  # build and test are required checks, and the macOS queue is the slow part of CI. A workflow-level paths filter would
  # leave both checks missing and block merges, so gate at job level instead: a skipped job with the same name still
  # satisfies the required check.
  build:
    needs: [changes, verify]
    # Skip only on an explicit false. If change detection fails, or its output is missing or masked, build anyway rather
    # than report a skipped (passing) check. !cancelled() rather than always(), so a run superseded by a newer push
    # gives its macOS runner back.
    # Also run unless verify succeeded with reuse=true. A failed or missing verify must run the job, never skip it, because
    # a plain reuse != 'true' check carries an implicit success().
    if: >-
      ${{ !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') &&
      (needs.verify.result != 'success' || needs.verify.outputs.reuse != 'true') }}
    # The code uses Xcode 27 SDK APIs (for example the FoundationModels samplingMode label), and macos-26 only ships Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | awk '/^Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # SwiftPM dependencies only: source checkouts, their bare clones, the binary xcframeworks (Sparkle, FluidAudio) and
      # the swift-syntax prebuilts. That is about 1.6 GB on disk and 1.1 GB compressed. Build products stay out: a full
      # .build is over 4 GB, which would evict everything else from the 10 GB repo cache. So each job still compiles
      # from scratch, but on a hit it downloads nothing.
      # The SwiftPM user cache keeps only artifacts and manifests because its repositories copy duplicates .build's.
      - name: Restore SwiftPM dependencies
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/prebuilts
            .build/repositories
            .build/workspace-state.json
            ~/Library/Caches/org.swift.swiftpm/artifacts
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-

      - name: Resolve dependencies
        run: swift package resolve

      # Saved from pushes only. A pull request's cache is scoped to that pull request, so saving there would spend the
      # repo quota on entries no other run can read. The test job restores the same key and never saves.
      - name: Save SwiftPM dependencies
        if: ${{ github.event_name != 'pull_request' && steps.swiftpm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/prebuilts
            .build/repositories
            .build/workspace-state.json
            ~/Library/Caches/org.swift.swiftpm/artifacts
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

  # Headless tests and offscreen Settings renders run on PRs and after merge. Desktop tests run locally.
  test:
    needs: [changes, verify]
    # Also run unless verify succeeded with reuse=true. A failed or missing verify must run the job, never skip it, because
    # a plain reuse != 'true' check carries an implicit success().
    if: >-
      ${{ !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') &&
      (needs.verify.result != 'success' || needs.verify.outputs.reuse != 'true') }}
    permissions:
      contents: read
    # The code uses Xcode 27 SDK APIs (for example the FoundationModels samplingMode label), and macos-26 only ships Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | awk '/^Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      # mlx-swift compiles Metal shaders, and Xcode ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # Same key and paths as the build job, which is the one that saves it.
      - name: Restore SwiftPM dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/prebuilts
            .build/repositories
            .build/workspace-state.json
            ~/Library/Caches/org.swift.swiftpm/artifacts
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-

      # Keyboard navigation and live preview tests activate real windows and need a free desktop. Offscreen renders
      # assert that their windows stay hidden, so they run here alongside the logic tests.
      # --no-parallel: Swift Testing runs unrelated MainActor-heavy suites at once, and on the 7.5 GB runner that causes the
      # recurring timing flakes.
      - name: Test with coverage
        run: scripts/swift-test.sh --no-parallel --enable-code-coverage --skip 'SettingsKeyboardAccessTests|AppearancePreviewLiveTests|glassInAShownWindowOverEachSwatch'

      - name: Coverage report
        run: |
          python3 -m unittest discover -s Tests/ReleaseTests -p test_swift_coverage.py
          scripts/swift-coverage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swift-coverage
          path: coverage-report.txt
          if-no-files-found: ignore

      # The Codecov job below uploads this. Keeping the upload out of this job keeps id-token off steps that run PR code.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' }}
        with:
          name: swift-coverage-lcov
          path: coverage.lcov
          if-no-files-found: ignore

  # Non-gating: the 80% floor in scripts/swift-coverage.sh is the gate, so a Codecov outage never fails the test job.
  # This is the only job with id-token (Codecov OIDC, so there is no repo secret). It runs no PR code, only the uploader.
  codecov:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: lcov
        continue-on-error: true
        with:
          name: swift-coverage-lcov

      - name: Upload coverage to Codecov
        if: ${{ steps.lcov.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.lcov
          disable_search: true
          # OIDC only for same-repo runs; fork PRs get no id-token and upload tokenless.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
        continue-on-error: true

  # Final job on push runs: writes the receipt a later verify looks for. It records only when build and test actually
  # ran and passed, so a reused result is never re-recorded and its age never refreshed.
  receipt:
    needs: [verify, build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Fail on a failed job or an unverified skip
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REUSE: ${{ needs.verify.outputs.reuse }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # Pushes always build, so a skipped job there needs a verified reuse. Pull requests may skip on the changes gate.
          if [ "$EVENT" != pull_request ] \
              && { [ "$BUILD_RESULT" = skipped ] || [ "$TEST_RESULT" = skipped ]; } \
              && { [ "$VERIFY_RESULT" != success ] || [ "$REUSE" != true ]; }; then
            echo "build or test skipped without a verified reuse"; exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job ended as $result"; exit 1 ;;
            esac
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
        with:
          persist-credentials: false

      - uses: CodesWhat/.github/actions/tree-receipt/record@b85ebce168f649bcd2fddf2ff0d433fb38e30866
        if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
