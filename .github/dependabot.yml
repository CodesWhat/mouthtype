version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev/v0.6.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /
    target-branch: dev/v0.6.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /website
    target-branch: dev/v0.6.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/docs
    target-branch: dev/v0.6.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # Track the engines Node major (24.x). @types/node must match the runtime, not the latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
