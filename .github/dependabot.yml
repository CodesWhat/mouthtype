version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev/v0.8.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /
    target-branch: dev/v0.8.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /website
    target-branch: dev/v0.8.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/docs
    target-branch: dev/v0.8.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: pip
    directory: /scripts/dmg
    target-branch: dev/v0.8.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
